<div class="metric-grid player-profile-summary">

    <div class="metric-card"><span>CURRENT TEAM</span><strong class="profile-summary-value">{% if not member.player_active %}<span data-i18n="Not playing">Not playing</span>{% elif profile.team_name %}<span data-no-i18n>{{ profile.team_name }}</span>{% else %}<span data-i18n="Free agent">Free agent</span>{% endif %}</strong>{% if profile.is_manager_player %}<small>Team Captain</small>{% endif %}</div>
    <div class="metric-card"><span>FIDE RATING</span><strong class="profile-summary-value profile-fide-rating">{{ profile.rating or '—' }}</strong></div>
  </div>

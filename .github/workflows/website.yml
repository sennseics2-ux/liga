name: Website checks
on:
  push:
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      RUN_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            website/requirements-dev.txt
            website/requirements-build.txt
      - name: Install verified dependency locks
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Check generated translations
        run: python tools/build_i18n.py --check
      - name: Check generated dark styling
        run: python tools/build_dark_theme.py --check
      - name: Run unit, migration, security and browser checks
        run: python -m pytest -q
      - name: Validate deployment configuration
        env:
          CHESS_DOMAIN: club.test
          CHESS_SESSION_SECRET: ci-configuration-only-not-used-in-production-123456789
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Build reproducible web image
        run: |
          docker build --target backup-offsite -t liga-website:ci .
          docker run --rm --network none --entrypoint restic liga-website:ci version
      - name: Validate pinned HTTPS proxy configuration
        run: |
          docker run --rm -i --network none -e CHESS_DOMAIN=club.test --entrypoint caddy \
            caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb \
            adapt --config - --adapter caddyfile --validate < deploy/Caddyfile > /dev/null
